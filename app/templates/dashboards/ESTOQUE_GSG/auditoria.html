{% extends "base/layout.html" %}
{% block page_title %}Auditoria IXC{% endblock %}
{% block content %}
<div class="page-header">
  <div class="page-header-left">
    <h1><i class="fas fa-search" style="color:var(--green);margin-right:10px;font-size:18px"></i>Auditoria IXC — Estoque</h1>
    <p>Histórico de sincronizações e divergências detectadas</p>
  </div>
  <button class="btn-refresh" onclick="loadAuditoria()"><i class="fas fa-sync-alt" id="icon-refresh"></i></button>
</div>

<div id="lista-auditoria"></div>

<script>
async function loadAuditoria() {
  document.getElementById('icon-refresh').classList.add('fa-spin');
  const res = await fetch('/api/estoque/auditoria');
  const data = await res.json();
  const logs = data.logs || [];
  const el = document.getElementById('lista-auditoria');
  el.innerHTML = logs.length ? `
    <div class="card">
      <div class="card-header"><span class="card-title"><i class="fas fa-history" style="margin-right:7px"></i>Histórico de Auditorias</span></div>
      <table class="table-gsg">
        <thead><tr><th>Data/Hora</th><th>Tipo</th><th style="text-align:right">Divergências</th><th>Descrição</th></tr></thead>
        <tbody>
          ${logs.map(l=>`<tr>
            <td style="color:var(--text3);font-size:12px">${l.criado_em}</td>
            <td><span class="badge badge-${l.divergencias>0?'red':'green'}">${l.tipo}</span></td>
            <td style="text-align:right;color:${l.divergencias>0?'var(--red)':'var(--green)'};font-weight:600">${l.divergencias}</td>
            <td style="font-size:12px;color:var(--text2)">${l.descricao||'—'}</td>
          </tr>`).join('')}
        </tbody>
      </table>
    </div>` : '<div style="color:var(--text3);font-size:13px;padding:2rem">Nenhum log de auditoria encontrado. Configure o cron para rodar a auditoria automaticamente.</div>';
  document.getElementById('icon-refresh').classList.remove('fa-spin');
}
window.onload = loadAuditoria;
</script>
{% endblock %}
