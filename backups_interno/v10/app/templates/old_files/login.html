<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Axiom Core - Login</title>
    <style>
        body { background: #0d1117; color: white; font-family: sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .login-card { background: #1c2128; padding: 40px; border-radius: 8px; border: 1px solid #30363d; width: 350px; text-align: center; }
        .login-input { width: 100%; padding: 12px; margin: 10px 0; background: #0d1117; border: 1px solid #30363d; border-radius: 6px; color: white; box-sizing: border-box; }
        .btn-login { width: 100%; padding: 12px; background: #1f6feb; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; margin-top: 10px; }
        .btn-login:hover { background: #388bfd; }
    </style>
</head>
<body>
    <div class="login-card">
        <h2 style="margin-bottom: 30px;">Axiom Core</h2>
        <form action="/auth/login" method="POST">
            <input type="text" name="login" placeholder="Usuário" class="login-input" required>
            <input type="password" name="senha" placeholder="Senha" class="login-input" required>
            <button type="submit" class="btn-login">Entrar no Sistema</button>
        </form>
    </div>
</body>
</html>
