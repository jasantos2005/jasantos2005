{% extends "base/layout.html" %}
{% block content %}
<div style="padding: 20px; color: white;">
    <h2>Gestão de Acessos</h2>
    <p style="color: #8b949e;">Selecione os módulos para liberar o acesso ao sistema.</p>

    <div style="display: grid; grid-template-columns: 1fr 2fr; gap: 20px; margin-top: 20px;">
        <div style="background: #1c2128; padding: 25px; border-radius: 8px; border: 1px solid #30363d;">
            <h4 style="margin-bottom: 20px;">Novo Usuário</h4>
            <form action="/admin/usuarios/cadastrar" method="POST">
                <input type="text" name="nome" placeholder="Nome" required style="width: 100%; padding: 10px; margin-bottom: 15px; background: #0d1117; border: 1px solid #30363d; border-radius: 6px; color: white;">
                <input type="text" name="login" placeholder="Login" required style="width: 100%; padding: 10px; margin-bottom: 15px; background: #0d1117; border: 1px solid #30363d; border-radius: 6px; color: white;">
                <input type="password" name="senha" placeholder="Senha" required style="width: 100%; padding: 10px; margin-bottom: 15px; background: #0d1117; border: 1px solid #30363d; border-radius: 6px; color: white;">
                <button type="submit" style="width: 100%; padding: 12px; background: #1f6feb; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold;">CADASTRAR</button>
            </form>
        </div>

        <div style="background: #1c2128; padding: 20px; border-radius: 8px; border: 1px solid #30363d;">
            <table style="width: 100%; text-align: left; border-collapse: collapse;">
                <tr style="color: #8b949e; border-bottom: 1px solid #30363d;">
                    <th style="padding: 10px;">USUÁRIO</th>
                    <th>LOGIN</th>
                    <th>AÇÕES</th>
                </tr>
                {% for u in usuarios %}
                <tr style="border-bottom: 1px solid #30363d;">
                    <td style="padding: 15px;">{{ u.nome }}</td>
                    <td>{{ u.login }}</td>
                    <td>
                        <button onclick="abrirModalPermissoes('{{ u.id }}', '{{ u.nome }}', '{{ u.permissoes }}')" style="background: #21262d; border: 1px solid #30363d; color: white; padding: 8px 15px; border-radius: 6px; cursor: pointer;">
                            <i class="fas fa-key"></i> PERMISSÕES
                        </button>
                    </td>
                </tr>
                {% endfor %}
            </table>
        </div>
    </div>
</div>

<div id="modalAcesso" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.9); z-index:9999; align-items:center; justify-content:center;">
    <div style="background:#1c2128; padding:30px; border-radius:12px; border:1px solid #30363d; width:350px;">
        <h3 id="nomeUsuarioModal" style="color:white; margin-top:0;"></h3>
        <p style="color:#8b949e; font-size:12px;">Selecione os módulos abaixo:</p>
        
        <div style="margin: 20px 0; display: flex; flex-direction: column; gap: 10px;">
            <label style="display: flex; align-items: center; gap: 10px; color: white; background: #161b22; padding: 15px; border-radius: 8px; border: 1px solid #30363d; cursor: pointer;">
                <input type="checkbox" id="checkReceber" value="FIN_REC" style="width: 20px; height: 20px;"> 
                <span>CONTAS A RECEBER</span>
            </label>
            <label style="display: flex; align-items: center; gap: 10px; color: white; background: #161b22; padding: 15px; border-radius: 8px; border: 1px solid #30363d; cursor: pointer;">
                <input type="checkbox" id="checkPagar" value="FIN_PAG" style="width: 20px; height: 20px;"> 
                <span>CONTAS A PAGAR</span>
            </label>
        </div>

        <div style="display: flex; gap: 10px;">
            <button onclick="enviarPermissoes()" style="flex:1; padding:12px; background:#238636; color:white; border:none; border-radius:6px; font-weight:bold; cursor:pointer;">SALVAR</button>
            <button onclick="document.getElementById('modalAcesso').style.display='none'" style="flex:1; padding:12px; background:#30363d; color:white; border:none; border-radius:6px; cursor:pointer;">FECHAR</button>
        </div>
    </div>
</div>

<script>
let idUsuarioLogado = null;

function abrirModalPermissoes(id, nome, perms) {
    idUsuarioLogado = id;
    document.getElementById('nomeUsuarioModal').innerText = nome;
    document.getElementById('modalAcesso').style.display = 'flex';
    
    // Marca os botões se o texto estiver no banco
    document.getElementById('checkReceber').checked = perms.includes('FIN_REC');
    document.getElementById('checkPagar').checked = perms.includes('FIN_PAG');
}

async function enviarPermissoes() {
    let selecionados = [];
    if(document.getElementById('checkReceber').checked) selecionados.push('FIN_REC');
    if(document.getElementById('checkPagar').checked) selecionados.push('FIN_PAG');
    
    let stringFinal = selecionados.join(', ');

    const resp = await fetch('/admin/usuarios/permissoes', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({
            usuario_id: idUsuarioLogado,
            permissoes: stringFinal
        })
    });

    if(resp.ok) { window.location.reload(); }
    else { alert("Erro ao salvar!"); }
}
</script>
{% endblock %}
