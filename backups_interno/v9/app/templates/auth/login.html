<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Axiom Core - Login</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background-color: #0d1117; color: #c9d1d9; font-family: -apple-system, sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .login-card { background: #161b22; border: 1px solid #30363d; padding: 40px; border-radius: 12px; width: 100%; max-width: 350px; text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        .logo-icon { font-size: 3rem; color: #238636; margin-bottom: 20px; }
        h2 { color: #e6edf3; margin-bottom: 25px; font-weight: 500; }
        input { width: 100%; background: #0d1117; border: 1px solid #30363d; color: white; padding: 12px; border-radius: 6px; margin-bottom: 15px; box-sizing: border-box; }
        button { width: 100%; background: #238636; color: white; border: none; padding: 12px; border-radius: 6px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        button:hover { background: #2ea043; }
        .error-msg { color: #f85149; font-size: 13px; margin-bottom: 15px; }
    </style>
</head>
<body>
    <div class="login-card">
        <i class="fas fa-layer-group logo-icon"></i>
        <h2>Axiom Core</h2>
        
        {% if error %}
        <div class="error-msg"><i class="fas fa-exclamation-circle"></i> {{ error }}</div>
        {% endif %}

        <form action="/auth/login" method="POST">
            <input type="text" name="username" placeholder="Usuário" required autofocus>
            <input type="password" name="password" placeholder="Senha" required>
            <button type="submit">ACESSAR SISTEMA</button>
        </form>
        <div style="margin-top: 25px; font-size: 11px; color: #8b949e;">
            Inteligência Operacional &copy; 2026
        </div>
    </div>
</body>
</html>
